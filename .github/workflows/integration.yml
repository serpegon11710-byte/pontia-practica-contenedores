name: CI test with Docker Compose

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate .env file for CI
        run: |
          echo "API_PORT=${{ vars.API_PORT }}" >> .env
          echo "DATABASE_SERVER=${{ vars.DATABASE_SERVER }}" >> .env
          echo "DATABASE_PORT=${{ vars.DATABASE_PORT }}" >> .env
          echo "DATABASE_CATALOG=${{ vars.DATABASE_CATALOG }}" >> .env
          echo "DATABASE_USER=${{ vars.DATABASE_USER }}" >> .env
          echo "DATABASE_PASSWORD=${{ secrets.DATABASE_PASSWORD }}" >> .env

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
            python-version: '3.10'

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ./python-api/src/requirements.txt

      - name: Start services with Docker Compose
        run: |
          docker compose -f ./compose.yml up -d --build

      - name: Run tests
        run: |
          pytest ./python-api/test/unit_test --verbose